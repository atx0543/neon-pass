<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="Shift_JIS">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>NEON PASS - パスワードジェネレーター</title>
  <style>
    :root {
      --bg: #080b16;
      --panel: rgba(18, 23, 43, 0.82);
      --panel-strong: #161c35;
      --line: rgba(142, 161, 255, 0.18);
      --text: #f5f7ff;
      --muted: #aab2cf;
      --cyan: #42e8e0;
      --purple: #8d68ff;
      --pink: #ff67b3;
      --danger: #ff6c7a;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Meiryo, "Yu Gothic UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(66, 232, 224, 0.12), transparent 28rem),
        radial-gradient(circle at 88% 20%, rgba(141, 104, 255, 0.18), transparent 30rem),
        linear-gradient(145deg, #070914 0%, #0c1020 55%, #080b16 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.2;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    button, input { font: inherit; }
    button { touch-action: manipulation; }

    .page {
      width: min(940px, calc(100% - 28px));
      margin: 0 auto;
      padding: 54px 0 42px;
      position: relative;
    }

    .hero { text-align: center; margin-bottom: 28px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 7px 13px;
      border: 1px solid rgba(66, 232, 224, 0.28);
      border-radius: 999px;
      color: var(--cyan);
      background: rgba(66, 232, 224, 0.07);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.13em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 13px var(--cyan);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 65px);
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(100deg, #fff 5%, #8ffdf7 46%, #b59cff 78%, #fff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 24px rgba(66, 232, 224, 0.13));
    }

    .subtitle {
      margin: 15px auto 0;
      max-width: 570px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .app-card {
      position: relative;
      padding: clamp(18px, 4vw, 32px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 28px 80px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .app-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -95px;
      top: -100px;
      border-radius: 50%;
      background: rgba(141, 104, 255, 0.18);
      filter: blur(30px);
      pointer-events: none;
    }

    .password-panel {
      position: relative;
      z-index: 1;
      padding: 18px;
      border: 1px solid rgba(66, 232, 224, 0.23);
      border-radius: var(--radius);
      background: rgba(6, 9, 20, 0.7);
      box-shadow: inset 0 0 30px rgba(66, 232, 224, 0.035);
    }

    .password-row { display: flex; gap: 10px; align-items: stretch; }

    #password {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 8px 4px;
      color: #fff;
      background: transparent;
      font-family: Consolas, "Courier New", monospace;
      font-size: clamp(18px, 4vw, 30px);
      font-weight: bold;
      letter-spacing: 0.055em;
      text-overflow: ellipsis;
    }

    .icon-btn {
      width: 48px;
      min-width: 48px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      color: var(--text);
      background: #202742;
      cursor: pointer;
      transition: transform .18s, border-color .18s, background .18s;
    }

    .icon-btn:hover { transform: translateY(-2px); border-color: var(--cyan); background: #27304f; }
    .icon-btn:focus-visible, .generate:focus-visible, input:focus-visible + .switch { outline: 3px solid rgba(66,232,224,.35); outline-offset: 3px; }

    .strength-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 12px;
    }

    #strengthLabel { color: var(--cyan); font-weight: bold; }
    .strength-track { height: 6px; margin-top: 8px; border-radius: 99px; background: #262c43; overflow: hidden; }
    #strengthBar { width: 0; height: 100%; border-radius: inherit; background: var(--cyan); box-shadow: 0 0 12px currentColor; transition: width .28s, background .28s; }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 20px;
    }

    .setting-card {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(22, 28, 53, 0.65);
    }

    .card-title { margin: 0 0 18px; font-size: 14px; letter-spacing: .04em; }
    .length-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }

    .length-value {
      min-width: 52px;
      padding: 7px 10px;
      border-radius: 11px;
      text-align: center;
      color: var(--cyan);
      background: rgba(66,232,224,.09);
      font-family: Consolas, monospace;
      font-weight: bold;
      font-size: 18px;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .range-labels { display: flex; justify-content: space-between; margin-top: 8px; color: #7f89aa; font-size: 11px; }

    .option-list { display: grid; gap: 12px; }
    .option { display: flex; align-items: center; justify-content: space-between; gap: 14px; cursor: pointer; color: #dfe4f7; font-size: 13px; }
    .option small { color: #818ba9; font-family: Consolas, monospace; }
    .option-copy { display: flex; flex-direction: column; gap: 3px; }
    .option input { position: absolute; opacity: 0; pointer-events: none; }

    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex: 0 0 auto;
      border-radius: 99px;
      background: #343b55;
      transition: background .2s;
    }

    .switch::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #b3bad1;
      transition: transform .2s, background .2s, box-shadow .2s;
    }

    .option input:checked + .switch { background: rgba(66,232,224,.28); }
    .option input:checked + .switch::after { transform: translateX(20px); background: var(--cyan); box-shadow: 0 0 12px rgba(66,232,224,.75); }

    .generate {
      width: 100%;
      margin-top: 20px;
      padding: 16px 22px;
      border: 0;
      border-radius: 16px;
      color: #081017;
      background: linear-gradient(100deg, var(--cyan), #74d4ff 48%, #b59cff);
      box-shadow: 0 12px 30px rgba(66,232,224,.2);
      font-weight: bold;
      letter-spacing: .08em;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s, filter .18s;
    }

    .generate:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(66,232,224,.28); filter: saturate(1.12); }
    .generate:active { transform: translateY(0); }
    .generate:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .error { min-height: 20px; margin: 10px 2px -8px; color: var(--danger); font-size: 12px; text-align: center; }

    .history-card { margin-top: 20px; }
    .history-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .clear-btn { border: 0; color: #929bb9; background: transparent; cursor: pointer; font-size: 12px; }
    .clear-btn:hover { color: #fff; }
    #history { display: grid; gap: 8px; margin-top: 13px; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 12px;
      color: #cfd5ea;
      background: rgba(7,10,22,.55);
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    .history-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-copy { border: 0; color: var(--cyan); background: transparent; cursor: pointer; font-family: Meiryo, sans-serif; font-size: 11px; }
    .empty { color: #737d9e; font-size: 12px; text-align: center; padding: 6px; }

    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 18px 0 0;
      color: #8d96b5;
      font-size: 11px;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      transform: translate(-50%, 20px);
      padding: 11px 17px;
      border: 1px solid rgba(66,232,224,.32);
      border-radius: 999px;
      color: #eaffff;
      background: rgba(14,22,34,.95);
      box-shadow: 0 10px 35px rgba(0,0,0,.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s, transform .22s;
      font-size: 12px;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 690px) {
      .page { padding-top: 32px; }
      .settings-grid { grid-template-columns: 1fr; gap: 14px; }
      .app-card { border-radius: 22px; }
      .password-panel { padding: 14px; }
      .icon-btn { width: 44px; min-width: 44px; }
      .subtitle { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="eyebrow"><span class="status-dot"></span>SECURE GENERATOR</div>
      <h1>NEON PASS</h1>
      <p class="subtitle">推測されにくいパスワードを、あなたの端末内だけで瞬時に生成します。</p>
    </header>

    <section class="app-card" aria-label="パスワード作成ツール">
      <div class="password-panel">
        <div class="password-row">
          <input id="password" type="text" readonly aria-label="生成されたパスワード" spellcheck="false">
          <button class="icon-btn" id="copyButton" type="button" title="コピー" aria-label="パスワードをコピー">&#9635;</button>
          <button class="icon-btn" id="refreshButton" type="button" title="再生成" aria-label="パスワードを再生成">&#8635;</button>
        </div>
        <div class="strength-head">
          <span>推定強度</span>
          <span id="strengthLabel">---</span>
        </div>
        <div class="strength-track" aria-hidden="true"><div id="strengthBar"></div></div>
      </div>

      <div class="settings-grid">
        <div class="setting-card">
          <div class="length-head">
            <h2 class="card-title">パスワードの長さ</h2>
            <output class="length-value" id="lengthValue" for="lengthRange">18</output>
          </div>
          <input id="lengthRange" type="range" min="8" max="64" value="18" aria-label="パスワードの長さ">
          <div class="range-labels"><span>8文字</span><span>64文字</span></div>
        </div>

        <div class="setting-card">
          <h2 class="card-title">使用する文字</h2>
          <div class="option-list">
            <label class="option">
              <span class="option-copy">英大文字 <small>A-Z</small></span>
              <input id="upper" type="checkbox" checked><span class="switch"></span>
            </label>
            <label class="option">
              <span class="option-copy">英小文字 <small>a-z</small></span>
              <input id="lower" type="checkbox" checked><span class="switch"></span>
            </label>
            <label class="option">
              <span class="option-copy">数字 <small>0-9</small></span>
              <input id="numbers" type="checkbox" checked><span class="switch"></span>
            </label>
            <label class="option">
              <span class="option-copy">記号 <small>!@#$%...</small></span>
              <input id="symbols" type="checkbox" checked><span class="switch"></span>
            </label>
            <label class="option">
              <span class="option-copy">紛らわしい文字を除外 <small>O 0 I l 1</small></span>
              <input id="excludeAmbiguous" type="checkbox"><span class="switch"></span>
            </label>
          </div>
        </div>
      </div>

      <p class="error" id="errorMessage" role="alert"></p>
      <button class="generate" id="generateButton" type="button">新しいパスワードを生成</button>

      <div class="setting-card history-card">
        <div class="history-head">
          <h2 class="card-title" style="margin:0">今回の生成履歴</h2>
          <button class="clear-btn" id="clearHistory" type="button">履歴を消去</button>
        </div>
        <div id="history"><div class="empty">まだ履歴はありません</div></div>
      </div>

      <p class="security-note"><span aria-hidden="true">&#9670;</span>生成処理はすべてブラウザ内で行われ、外部には送信されません。</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">コピーしました</div>

  <script>
    // パスワード生成に使う文字セット
    const CHARACTER_SETS = {
      upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
      lower: "abcdefghijklmnopqrstuvwxyz",
      numbers: "0123456789",
      symbols: "!@#$%^&*()-_=+[]{};:,.?"
    };
    const AMBIGUOUS = "O0Iil1";

    const passwordField = document.getElementById("password");
    const lengthRange = document.getElementById("lengthRange");
    const lengthValue = document.getElementById("lengthValue");
    const errorMessage = document.getElementById("errorMessage");
    const strengthBar = document.getElementById("strengthBar");
    const strengthLabel = document.getElementById("strengthLabel");
    const generateButton = document.getElementById("generateButton");
    const historyBox = document.getElementById("history");
    const toast = document.getElementById("toast");
    const histories = [];
    let toastTimer;

    // 暗号学的に安全な乱数を、指定範囲内で偏りなく取得
    function secureRandom(max) {
      if (max <= 0) return 0;
      const limit = Math.floor(4294967296 / max) * max;
      const values = new Uint32Array(1);
      do {
        crypto.getRandomValues(values);
      } while (values[0] >= limit);
      return values[0] % max;
    }

    function randomCharacter(characters) {
      return characters[secureRandom(characters.length)];
    }

    function shuffleSecurely(items) {
      for (let i = items.length - 1; i > 0; i--) {
        const j = secureRandom(i + 1);
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    function getSelectedSets() {
      const exclude = document.getElementById("excludeAmbiguous").checked;
      return ["upper", "lower", "numbers", "symbols"]
        .filter(id => document.getElementById(id).checked)
        .map(id => exclude
          ? CHARACTER_SETS[id].split("").filter(char => !AMBIGUOUS.includes(char)).join("")
          : CHARACTER_SETS[id]);
    }

    // 選択した各文字種を最低1文字ずつ含めて生成
    function generatePassword(addToHistory = true) {
      const selectedSets = getSelectedSets();
      const length = Number(lengthRange.value);

      if (!window.crypto || !window.crypto.getRandomValues) {
        errorMessage.textContent = "このブラウザでは安全な乱数生成を利用できません。";
        return;
      }
      if (selectedSets.length === 0) {
        errorMessage.textContent = "使用する文字を1種類以上選んでください。";
        generateButton.disabled = true;
        return;
      }

      generateButton.disabled = false;
      errorMessage.textContent = "";
      const allCharacters = selectedSets.join("");
      const result = selectedSets.map(randomCharacter);
      while (result.length < length) result.push(randomCharacter(allCharacters));

      const password = shuffleSecurely(result).join("");
      passwordField.value = password;
      updateStrength(length, allCharacters.length);
      if (addToHistory) addHistory(password);
    }

    function updateStrength(length, poolSize) {
      const entropy = length * Math.log2(Math.max(poolSize, 1));
      let label = "弱い";
      let width = 22;
      let color = "#ff6c7a";
      if (entropy >= 100) { label = "非常に強い"; width = 100; color = "#42e8e0"; }
      else if (entropy >= 70) { label = "強い"; width = 78; color = "#73e48f"; }
      else if (entropy >= 45) { label = "標準"; width = 55; color = "#ffd166"; }
      strengthLabel.textContent = label + "（約" + Math.floor(entropy) + "ビット）";
      strengthLabel.style.color = color;
      strengthBar.style.width = width + "%";
      strengthBar.style.background = color;
    }

    async function copyText(text) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch (error) {
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
      }
      showToast("コピーしました");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function addHistory(password) {
      if (histories[0] === password) return;
      histories.unshift(password);
      histories.splice(5);
      renderHistory();
    }

    function renderHistory() {
      historyBox.textContent = "";
      if (histories.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "まだ履歴はありません";
        historyBox.appendChild(empty);
        return;
      }
      histories.forEach(password => {
        const row = document.createElement("div");
        row.className = "history-item";
        const text = document.createElement("span");
        text.className = "history-text";
        text.textContent = password;
        const button = document.createElement("button");
        button.className = "history-copy";
        button.type = "button";
        button.textContent = "コピー";
        button.addEventListener("click", () => copyText(password));
        row.append(text, button);
        historyBox.appendChild(row);
      });
    }

    lengthRange.addEventListener("input", () => {
      lengthValue.textContent = lengthRange.value;
      generatePassword(false);
    });

    document.querySelectorAll('.option input').forEach(input => {
      input.addEventListener("change", () => {
        const hasSelection = getSelectedSets().length > 0;
        generateButton.disabled = !hasSelection;
        if (hasSelection) generatePassword(false);
        else errorMessage.textContent = "使用する文字を1種類以上選んでください。";
      });
    });

    generateButton.addEventListener("click", () => generatePassword(true));
    document.getElementById("refreshButton").addEventListener("click", () => generatePassword(true));
    document.getElementById("copyButton").addEventListener("click", () => copyText(passwordField.value));
    document.getElementById("clearHistory").addEventListener("click", () => {
      histories.length = 0;
      renderHistory();
      showToast("履歴を消去しました");
    });

    generatePassword(true);
  </script>
</body>
</html>
